<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ירח דבש ביפן</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF6F1; --card:#FFFFFF; --ink:#1F2F5C; --ink2:#68708E; --line:#EEE6DF; --soft:#FCEEF0;
  --honey:#F2A900; --honey-ink:#96690A; --red:#E8452C; --red-soft:#FDE9E4; --ok:#6A8F3A; --orb:#E8452C;
  --tokyo:#E8452C; --kanazawa:#D39A00; --osaka:#1B95A6; --kyoto:#7B5BA8; --hakone:#6A8F3A;
  --night1:#1F3A6E; --night2:#3F66B0; --bar:rgba(255,255,255,.9); --barline:rgba(31,47,92,.10);
  --lift:0 10px 30px -14px rgba(31,47,92,.3);
  --display:"Frank Ruhl Libre","David Libre","Times New Roman",serif;
  --body:"Assistant","Arial Hebrew","Segoe UI",Arial,sans-serif;
  --jp:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Hiragino Sans","Noto Sans JP",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#090D22; --card:#141938; --ink:#EEF0FA; --ink2:#A0A6C8; --line:#252B52; --soft:#1B2147;
    --honey:#F4BE55; --honey-ink:#F4BE55; --red:#F2604F; --red-soft:#3A1C24; --ok:#9CC56A; --orb:#F4BE55;
    --tokyo:#F27A52; --kanazawa:#DDB54A; --osaka:#4DB9CC; --kyoto:#A58AD6; --hakone:#9CC56A;
    --night1:#060920; --night2:#222A66; --bar:rgba(20,25,56,.88); --barline:rgba(255,255,255,.10);
    --lift:0 10px 30px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#090D22; --card:#141938; --ink:#EEF0FA; --ink2:#A0A6C8; --line:#252B52; --soft:#1B2147;
  --honey:#F4BE55; --honey-ink:#F4BE55; --red:#F2604F; --red-soft:#3A1C24; --ok:#9CC56A; --orb:#F4BE55;
  --tokyo:#F27A52; --kanazawa:#DDB54A; --osaka:#4DB9CC; --kyoto:#A58AD6; --hakone:#9CC56A;
  --night1:#060920; --night2:#222A66; --bar:rgba(20,25,56,.88); --barline:rgba(255,255,255,.10);
  --lift:0 10px 30px -12px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--honey);outline-offset:2px}
bdi{unicode-bidi:isolate}.ltr{unicode-bidi:isolate;direction:ltr;display:inline-block}
.jp{font-family:var(--jp)}
main{max-width:620px;margin:0 auto;padding:16px 16px calc(112px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0;line-height:1.15}
.view[hidden]{display:none}

.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 4px 14px}
.top .brand{font-family:var(--display);font-weight:900;font-size:23px;display:flex;align-items:center;gap:9px;white-space:nowrap}
.top .brand::before{content:"";width:18px;height:18px;border-radius:50%;background:var(--orb);box-shadow:0 0 0 5px color-mix(in srgb,var(--orb) 20%,transparent)}
.top .side{display:flex;gap:6px;align-items:center}
.modebtn{font-size:12.5px;font-weight:700;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 11px;white-space:nowrap}
.sync{white-space:nowrap}
.sync{font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 11px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ink2);display:inline-block}
.sync.on i{background:var(--ok)}

/* hero: night sky over the city */
.hero{position:relative;border-radius:26px 26px 0 0;overflow:hidden;color:var(--htext);min-height:290px;padding:20px 22px 0;
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 58%,var(--sky3) 100%)}
.hero.night{--sky1:#0B1030;--sky2:#2A3273;--sky3:color-mix(in srgb,var(--c,#7B5BA8) 55%,#2A3273);--sfar:#1A2260;--smid:#10163F;--snear:#070A20;--sfuji:#2B3580;--swheel:#5560B8;--slight:#F6C55A;--htext:#fff;--hnum:#F6C55A;--pill:rgba(255,255,255,.14);--pillb:rgba(255,255,255,.22);--stars:1;--hsh:0 1px 10px rgba(6,9,32,.6)}
.hero.day{--sky1:#7EC0E6;--sky2:#D3EAF6;--sky3:#FCDDE3;--sfar:#B7CDEB;--smid:#8AA7D8;--snear:#2B4C8C;--sfuji:#7F9DD4;--swheel:#6384C4;--slight:#FFF1B8;--htext:#1F2F5C;--hnum:#E8452C;--pill:rgba(255,255,255,.62);--pillb:rgba(255,255,255,.85);--stars:0;--hsh:0 1px 8px rgba(255,255,255,.7)}
.hero.dusk{--sky1:#35367F;--sky2:#E67A90;--sky3:#FBC47C;--sfar:#7D579F;--smid:#4C367F;--snear:#1C1542;--sfuji:#6B4B9D;--swheel:#3B2B72;--slight:#FFE08A;--htext:#fff;--hnum:#FFE9B5;--pill:rgba(255,255,255,.18);--pillb:rgba(255,255,255,.32);--stars:.35;--hsh:0 1px 10px rgba(28,21,66,.55)}
.sf{fill:var(--sfar)}.sm{fill:var(--smid)}.sn{fill:var(--snear)}.sr{fill:#E8452C}.sh{fill:var(--slight)}.sth{stroke:var(--slight);fill:none}.stw{stroke:var(--swheel)}.sfj{fill:var(--sfuji)}
.hero .stars{opacity:var(--stars)}
.hero svg.sky{position:absolute;inset:0;width:100%;height:100%}
.hero .htop,.hero .hnum{position:relative}
.hero .htop{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600}
.hero .pill{background:var(--pill);border:1px solid var(--pillb);border-radius:99px;padding:3px 12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hero .pill.city{background:var(--c);border-color:transparent;color:#fff}
.hero .hnum{font-family:var(--display);font-weight:500;font-size:22px;margin-top:18px;text-shadow:var(--hsh);line-height:1;display:flex;align-items:baseline;gap:10px}
.hero .hnum b{font-weight:900;font-size:84px;line-height:.8;color:var(--hnum);letter-spacing:-.02em}
.under .htitle{font-family:var(--display);font-weight:900;font-size:26px;line-height:1.2;padding:16px 4px 0}
.under{background:var(--card);border-radius:0 0 26px 26px;padding:0 18px 16px;box-shadow:var(--lift)}
.under .progress{margin:0 -18px;border-radius:0;height:5px}
.under .progress span{border-radius:0}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:0}
.facts>div{padding:13px 4px 0;font-size:13px;color:var(--ink2)}
.facts b{display:block;font-size:16.5px;color:var(--ink);font-weight:700;line-height:1.3}

.block{background:var(--card);border-radius:22px;padding:18px;margin-top:14px;border:1px solid var(--line)}
.block h2{font-family:var(--display);font-weight:900;font-size:25px;margin-bottom:8px}
.block h3{font-size:16px;font-weight:700}
.muted{color:var(--ink2);font-size:14.5px}
.sec{margin-top:20px}
.sec:first-of-type{margin-top:6px}
.sechead{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.sechead h3{background:var(--soft);border-radius:99px;padding:4px 13px;font-size:14.5px}
.sechead .time{font-size:13.5px;color:var(--ink2)}
.sec.now .sechead h3{background:var(--red);color:#fff}
.sec.now .sechead h3::after{content:" · עכשיו";font-weight:600}
.stop{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:9px 0}
.stop:not(:last-child)::before{content:"";position:absolute;inset-inline-start:14px;top:42px;bottom:-8px;width:2px;background:var(--line);border-radius:2px}
.stop.done:not(:last-child)::before{background:var(--red)}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;padding:0;margin-top:1px;transition:transform .15s,background .15s}
.chk:active{transform:scale(.88)}
.chk svg{width:15px;height:15px;opacity:0}
.stop.done .chk{background:var(--red);border-color:var(--red)}
.stop.done .chk svg{opacity:1}
.stop.done .name{color:var(--ink2)}
.stop .name{font-weight:700;line-height:1.3;font-size:16.5px}
.stop .note{font-size:14.5px;color:var(--ink2);line-height:1.4;margin-top:2px}
.map{width:36px;height:36px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--ink);text-decoration:none}
.map svg{width:17px;height:17px}
.bonus{background:color-mix(in srgb,var(--honey) 16%,var(--card));border-radius:16px;padding:12px 14px;margin-top:16px;font-size:15px;display:flex;gap:10px}
.bonus::before{content:"";flex:none;width:12px;height:12px;border-radius:50%;background:var(--honey);margin-top:6px}
textarea{width:100%;min-height:92px;border:1.5px solid var(--line);border-radius:14px;background:var(--soft);padding:11px 13px;resize:vertical}
.addbtn{width:100%;margin-top:16px;border:1.5px dashed var(--ink2);background:transparent;border-radius:14px;padding:11px;font-weight:700;color:var(--ink2)}
.addform{margin-top:16px;background:var(--soft);border-radius:16px;padding:14px;display:grid;gap:8px}
.addform input{width:100%;border:1.5px solid var(--line);border-radius:12px;background:var(--card);padding:10px 12px}
.addform .row{margin-top:2px}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.pick{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:4px 13px;font-weight:600;font-size:14.5px}
.pick[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mine{font-size:11.5px;font-weight:700;color:var(--honey-ink);background:color-mix(in srgb,var(--honey) 20%,transparent);border-radius:99px;padding:1px 8px;margin-inline-start:8px;vertical-align:1px;white-space:nowrap}
.del{border:0;background:none;padding:2px 0;font-size:13px;color:var(--ink2);text-decoration:underline}
.acts{display:flex;gap:6px}
.trivia{list-style:none;margin:0;padding:0}
.trivia li{position:relative;padding:9px 0;padding-inline-start:22px;border-bottom:1px solid var(--line);font-size:15.5px;line-height:1.45}
.trivia li:last-child{border-bottom:0}
.trivia li::before{content:"";position:absolute;inset-inline-start:2px;top:17px;width:9px;height:9px;border-radius:50%;background:var(--red)}
.msgs{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.msgs:empty{margin:6px 0}
.msg{max-width:88%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;font-size:16px;line-height:1.45;overflow-wrap:anywhere}
.msg.me{align-self:flex-start;background:var(--ink);color:var(--bg);border-start-start-radius:6px}
.msg.ai{align-self:flex-end;background:var(--soft);border-start-end-radius:6px}
.msg.err{background:var(--red-soft)}
.ideas{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.idea{text-align:start;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:9px 13px;font-size:15px}
.star{width:36px;height:36px;border-radius:50%;border:0;background:var(--soft);display:grid;place-items:center;color:var(--ink2);padding:0}
.star svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.star[aria-pressed="true"]{background:color-mix(in srgb,var(--honey) 28%,var(--card));color:var(--honey-ink)}
.star[aria-pressed="true"] svg{fill:var(--honey);stroke:var(--honey)}
.favs{background:color-mix(in srgb,var(--honey) 13%,var(--card));border:1.5px solid color-mix(in srgb,var(--honey) 45%,transparent);border-radius:16px;padding:12px 14px;margin:4px 0 8px}
.favhead{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--honey-ink);margin-bottom:4px}
.favhead b{font-size:16px}
.favrow{display:flex;gap:10px;align-items:center;padding:6px 0}
.favrow .name{font-weight:700;line-height:1.3}
.favrow.done .chk{background:var(--red);border-color:var(--red)}.favrow.done .chk svg{opacity:1}
.favrow.done .name{color:var(--ink2);text-decoration:line-through}
.favhint{margin:0 0 4px}
.favpick[aria-pressed="true"]{background:var(--honey);border-color:var(--honey);color:#1F2F5C}
.progress{height:7px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:10px}
.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--honey),var(--red));border-radius:4px;transition:width .35s}

/* day rail */
.rail{display:flex;overflow-x:auto;margin:0 -16px;padding:4px 16px 12px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.st{flex:none;width:52px;background:none;border:0;padding:0;text-align:center;position:relative}
.st::before{content:"";position:absolute;top:21px;left:0;right:0;height:4px;background:var(--c)}
.st:first-child::before{right:50%}.st:last-child::before{left:50%}
.st .dot{position:relative;width:36px;height:36px;border-radius:50%;background:var(--card);border:3px solid var(--c);margin:5px auto 0;display:grid;place-items:center;font-weight:700;font-size:15px;line-height:1;transition:transform .15s}
.st .wd{font-size:12px;color:var(--ink2);margin-top:5px}
.st[aria-current="true"] .dot{background:var(--c);color:#fff;transform:scale(1.22);box-shadow:0 4px 12px -3px var(--c)}
.st.today .wd{color:var(--red);font-weight:700}
.dayhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dayhead .tag{font-size:13px;font-weight:700;color:#fff;background:var(--c);border-radius:99px;padding:3px 12px;white-space:nowrap}
.daytitle{font-family:var(--display);font-weight:900;font-size:30px;line-height:1.1;margin:10px 0 6px}

/* tools */
.conv{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
.night{background:linear-gradient(160deg,var(--night1),var(--night2));color:#fff;border-color:transparent}
.night .muted,.night label{color:rgba(255,255,255,.7)}
.conv label{font-size:13px;display:block}
.conv input{width:100%;font-family:var(--display);font-size:38px;font-weight:900;border:0;border-bottom:2px solid rgba(255,255,255,.3);background:transparent;padding:0 2px;direction:ltr;text-align:start;color:#fff;border-radius:0}
.conv #ils{color:#F6C55A}
.conv .eq{font-family:var(--display);font-size:30px;padding-bottom:6px;opacity:.6}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#fff;border-radius:99px;padding:5px 13px;font-weight:600;font-size:15px}
.rate{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:15px}
.rate input{width:70px;border:1px solid rgba(255,255,255,.3);border-radius:10px;background:rgba(255,255,255,.1);padding:3px 8px;direction:ltr;color:#fff}
.phrase{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 0;border:0;border-bottom:1px solid var(--line);align-items:center;width:100%;background:none;text-align:start}
.phrase:last-child{border-bottom:0}
.phrase .he{font-weight:700}
.phrase .ja{font-family:var(--jp);font-size:17px;direction:ltr;text-align:end}
.phrase .ro{font-size:13.5px;color:var(--ink2);direction:ltr;text-align:end}
.phrase .show{font-size:13px;font-weight:700;background:var(--soft);border-radius:99px;padding:6px 13px;white-space:nowrap}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:14px;padding:11px 18px;font-weight:700;display:inline-block}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.answer{white-space:pre-wrap;background:var(--soft);border-radius:14px;padding:13px;margin-top:12px;font-size:16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;font-size:15.5px;margin:0}
.kv dt{font-weight:700}.kv dd{margin:0;color:var(--ink2)}
.lug{display:flex;gap:12px;align-items:center;font-size:15.5px}
.lug .ic{flex:none;width:40px;height:40px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:19px}

.overlay{position:fixed;inset:0;background:linear-gradient(180deg,var(--night1),var(--night2));color:#fff;z-index:50;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) 22px calc(24px + env(safe-area-inset-bottom,0px));text-align:center}
.overlay[hidden]{display:none}
.overlay .bigja{font-family:var(--jp);font-weight:700;font-size:clamp(36px,10vw,64px);line-height:1.35;direction:ltr}
.overlay .bigro{font-size:18px;opacity:.7;margin-top:16px;direction:ltr}
.overlay .bighe{font-size:20px;font-weight:700;margin-top:6px;color:#F6C55A}
.overlay .btn{background:#fff;color:#0B1030}.overlay .btn.ghost{background:rgba(255,255,255,.14);color:#fff}

/* stamp book */
.book{background-image:radial-gradient(var(--line) 1.2px,transparent 1.3px);background-size:18px 18px;background-position:9px 9px}
.stamps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 6px;margin-top:18px}
.stamp{text-align:center}
.stamp svg{width:86px;height:86px;display:block;margin:0 auto;color:var(--line)}
.stamp.on svg{color:var(--red);transform:rotate(var(--r,-6deg));filter:url(#ink)}
.stamp.pop svg{animation:press .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes press{from{transform:scale(1.9) rotate(10deg);opacity:0}to{opacity:1}}
.stamp .lbl{font-size:14px;font-weight:700;line-height:1.2;margin-top:6px}
.stamp .cnt{font-size:12.5px;color:var(--ink2)}
.stamp:not(.on) .lbl{color:var(--ink2)}
.counter{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.counter:last-child{border-bottom:0}
.counter .n{font-family:var(--display);font-weight:900;font-size:28px;min-width:38px;text-align:center;line-height:1;color:var(--honey-ink)}
.counter button{width:38px;height:38px;border-radius:50%;border:0;background:var(--soft);font-size:22px;line-height:1;padding:0}
.bk{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.bk:last-child{border-bottom:0}
.bk.done .name{color:var(--ink2);text-decoration:line-through}
.bk.done .chk{background:var(--ok);border-color:var(--ok)}.bk.done .chk svg{opacity:1}
.bk .when{font-size:12.5px;font-weight:700;color:var(--honey-ink);background:color-mix(in srgb,var(--honey) 18%,transparent);border-radius:99px;padding:1px 9px;display:inline-block}
.todo{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.todo:last-of-type{border-bottom:0}

/* floating tab bar */
nav.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;padding:0 14px calc(12px + env(safe-area-inset-bottom,0px));z-index:20;pointer-events:none}
nav.tabs .in{pointer-events:auto;display:grid;grid-template-columns:repeat(6,1fr);width:100%;max-width:480px;background:var(--bar);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--barline);border-radius:24px;padding:6px;box-shadow:var(--lift)}
nav.tabs a{text-decoration:none;color:var(--ink2);text-align:center;padding:6px 0 7px;font-size:12px;font-weight:600;border-radius:18px;transition:background .2s,color .2s}
nav.tabs a .k{display:block;font-family:var(--jp);font-weight:700;font-size:20px;line-height:1.25}
nav.tabs a[aria-current="page"]{background:var(--red);color:#fff}
.toast{position:fixed;bottom:calc(100px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--red);color:#fff;padding:10px 20px;border-radius:99px;font-weight:700;z-index:40;max-width:90vw;text-align:center;box-shadow:var(--lift)}
.toast[hidden]{display:none}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

   <div class="row"><button class="btn" id="chatSend"${chatBusy?" disabled":""}>${ai?"שליחה":"פתיחה ב-Claude"}</button>${ai&&aiImages?`<label class="btn ghost">תרגום תפריט מתמונה<input type="file" id="chatPhoto" accept="image/*" capture="environment" hidden></label>`:""}${chat.length?`<button class="btn ghost" id="chatClear">שיחה חדשה</button>`:""}</div></div>`;
}
function chatScroll(){const q=$("#chatQ"); if(q)q.scrollIntoView({block:"center"});}
async function sendChat(text,file){
  text=(text||"").trim(); if(!text||chatBusy)return;
  if(!ai){window.open("https://claude.ai/new?q="+encodeURIComponent(guideContext()+"\n\nהשאלה: "+text),"_blank","noopener");return;}
  const hist=chat.filter(m=>!m.skip).slice(-12); while(hist.length&&hist[0].role!=="user")hist.shift();
  const msgs=hist.map(m=>({role:m.role,content:m.content})); msgs.push({role:"user",content:text});
  msgs[0]={role:"user",content:guideContext()+"\n\n"+msgs[0].content};
  const u={role:"user",content:file?"תרגום תפריט מתמונה":text}, a={role:"assistant",content:"חושב…"};
  if(file)u.skip=a.skip=true;
  chat.push(u,a); chatBusy=true; renderChat(); chatScroll();
  try{
    const res=await ai(msgs,Object.assign({cache:false,onText:x=>{a.content=x.text;const o=document.getElementById("chatLive");if(o)o.textContent=x.text;}},file?{images:[file]}:{}));
    a.content=res.text;
  }catch(err){
    const c=err&&err.code; u.skip=a.skip=true; a.err=true;
    a.content=c==="not_granted"?"כדי להשתמש בצ׳אט צריך לאשר ל-Claude לענות בדף הזה.":c==="rate_limited"?"יותר מדי שאלות ברצף. נסו שוב בעוד רגע.":c==="image_rejected"?"התמונה לא התקבלה. נסו לצלם שוב, קרוב יותר.":"לא התקבלה תשובה. בדקו את החיבור ונסו שוב.";
  }
  chatBusy=false; saveChat(); if(tab==="chat"){renderChat();chatScroll();}
}

/* ---------- boot ---------- */
window.addEventListener("hashchange",()=>show(location.hash.slice(1)));
(function(){const j=jstParts();const i=DAYS.findIndex(x=>x.d===j.date);routeDay=i<0?0:i;})();
applyPhase();
show(location.hash.slice(1)||"today");
setInterval(()=>{if(applyPhase())rerenderSafe();const j=jstParts();document.querySelectorAll('[data-clock="jp"]').forEach(e=>e.textContent=j.time);document.querySelectorAll('[data-clock="il"]').forEach(e=>e.textContent=ilTime());},30000);

function rerenderSafe(){const a=document.activeElement;if(a&&(a.tagName==="TEXTAREA"||a.tagName==="INPUT"))return;RENDER[tab]();}
(async function(){
  if(!window.claude||!window.claude.use)return;
  window.claude.use("sample").then(async s=>{if(!s)return;ai=s;try{const l=await s.limits();aiImages=!!(l&&l.images);}catch(_){ }if(tab==="chat")rerenderSafe();});
  window.claude.use("tts").then(t=>{tts=t||null;});
  const db=await window.claude.use("db"); if(!db)return;
  try{
    docRef=db.doc("trip/state");
    const snap=await docRef.get();
    if(snap.exists){merge(state,snap.data());saveLocal();shared=true;}
    else{try{await docRef.set(JSON.parse(JSON.stringify(state)));shared=true;}catch(_){shared=false;}}
    setSync();rerenderSafe();
    docRef.onSnapshot(s=>{if(!s.exists||s.metadata.hasPendingWrites)return;const before=JSON.stringify(state);merge(state,s.data());if(JSON.stringify(state)!==before){saveLocal();rerenderSafe();}},()=>{shared=false;setSync();});
  }catch(_){shared=false;setSync();}
})();
</script>
